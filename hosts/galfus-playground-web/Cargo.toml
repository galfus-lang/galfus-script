[package]
name = "galfus-playground-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Galfus playground API — run Galfus source in-process and capture output"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
galfus-core = { path = "../../engine/galfus-core" }
galfus-bytecode = { path = "../../engine/galfus-bytecode" }
galfus-contract = { path = "../../engine/galfus-contract" }
galfus-runtime = { path = "../../engine/galfus-runtime" }
galfus-workspace = { path = "../../engine/galfus-workspace" }
galfus-host-web = { path = "../galfus-host-web" }
anyhow = { workspace = true }

# Optional wasm feature
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { version = "0.3", features = ["ReadableStream", "WritableStream"], optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:serde_json"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
