[package]
name = "galfus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
metrics = ["galfus-runtime/metrics", "galfus-host-native/metrics"]

[dependencies]
galfus-core = { path = "../../engine/galfus-core" }
galfus-contract = { path = "../../engine/galfus-contract" }
galfus-bytecode = { path = "../../engine/galfus-bytecode" }
galfus-runtime = { path = "../../engine/galfus-runtime" }
galfus-workspace = { path = "../../engine/galfus-workspace" }
galfus-host-native = { path = "../galfus-host-native" }

anyhow.workspace = true
tracing.workspace = true

clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = "0.3"
dialoguer = "0.11"
ureq = { version = "2.9", features = ["json"] }
dirs = "5.0"
serde.workspace = true
serde_json.workspace = true
self-replace = "1.5"
toml.workspace = true
