[workspace]
members = [
    "engine/*",
    "hosts/*",
]
exclude = ["fuzz"]
default-members = ["hosts/galfus-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.metadata.galfus.package-image]
format-version = "2.0.0"
bytecode-format-version = "2.0.0"
boundary-abi-version = "1.0.0"
numeric-semantics-version = "1.0.0"

[workspace.lints.clippy]
result_large_err = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
# Serialization / binary data format
serde = { version = "1.0", features = ["derive", "rc"] }
toml = "0.8"
postcard = { version = "1.1", features = ["use-std"] }
sha2 = "0.10"

# Deterministic / structural collections
indexmap = "2.14"

# Allocation / small-data optimization
smallvec = "1.15"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Observability / diagnostics
tracing = "0.1"

# Development / watch mode / hot reload
notify = "8.2"

# WASM / playground
wasm-bindgen = "0.2.122"
js-sys = "0.3"
serde_json = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.release-min]
inherits = "release"
opt-level = "z"
panic = "abort"
