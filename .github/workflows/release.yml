name: Build and Release Hosts

on:
  push:
    branches:
      - stable/v*
      - alpha/v*
      - beta/v*
      - next/v*
      - latest/v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosts-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Run Tests
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.alias }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            alias: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            alias: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            alias: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            alias: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            alias: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Apply version from release branch
        id: version
        working-directory: scripts
        run: bun cmd github set-version --component hosts

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install AArch64 GCC (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Setup Cargo Target (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo "[target.aarch64-unknown-linux-gnu]" >> .cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> .cargo/config.toml

      - name: Build Host (Debug)
        working-directory: scripts
        run: bun cmd hosts build -t ${{ matrix.alias }} -p debug

      - name: Build Host (Fastest)
        working-directory: scripts
        run: bun cmd hosts build -t ${{ matrix.alias }} -p fastest

      - name: Build Host (Minimal)
        working-directory: scripts
        run: bun cmd hosts build -t ${{ matrix.alias }} -p minimal

      - name: Build CLI
        run: cargo build --release -p galfus-cli --target ${{ matrix.target }}

      - name: Prepare CLI Artifact
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          fi
          cp target/${{ matrix.target }}/release/galfus-cli$EXT build/galfus-cli-${{ matrix.alias }}$EXT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galfus-hosts-${{ matrix.alias }}
          path: build/*
          if-no-files-found: error
          retention-days: 1

  build-web:
    name: Build Web Targets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Apply version from release branch
        id: version
        working-directory: scripts
        run: bun cmd github set-version --component web

      - name: Update Cargo lockfile
        run: cargo generate-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Build Playground Web
        working-directory: scripts
        run: bun cmd playground build -t web

      - name: Build Host Web
        working-directory: scripts
        run: bun cmd hosts build -t web -p release

      - name: Run Web Provider and Playground Suites
        run: |
          cargo test -p galfus-host-web --test provider_fixture
          bun test hosts/galfus-host-web/tests/web_provider_suite.test.ts
          bun test hosts/galfus-playground-web/tests/playground_suite.test.ts

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galfus-web-artifacts
          path: build/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install script dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Apply version from release branch
        id: version
        working-directory: scripts
        run: bun cmd github set-version --component hosts

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: galfus-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v${{ steps.version.outputs.version }}-${{ steps.version.outputs.tag }}'
          name: Release "v${{ steps.version.outputs.version }}-${{ steps.version.outputs.tag }}"
          files: artifacts/*
          draft: false
          prerelease: ${{ !startsWith(github.ref_name, 'stable/') }}
          generate_release_notes: true

      - name: Upload to Storage
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.STORAGE_REGION }}
        run: |
          # The structure requested is: {component}/{tag}/{version}/{os}/{arch}/{filename}
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          STORAGE_ID="${{ secrets.STORAGE_ID }}"
          STORAGE_ENDPOINT="${{ secrets.STORAGE_ENDPOINT }}"
          STORAGE_KEY="${{ secrets.STORAGE_KEY }}"

          for item in artifacts/*; do
            if [ ! -e "$item" ]; then continue; fi
            FILENAME=$(basename "$item")
            
            # Extract component based on filename
            COMPONENT="host-native"
            if [[ "$FILENAME" == galfus-cli* ]]; then
              COMPONENT="cli"
            elif [[ "$FILENAME" == galfus-playground-web* ]]; then
              COMPONENT="playground-web"
            elif [[ "$FILENAME" == galfus-host-web* ]]; then
              COMPONENT="host-web"
            fi
            
            # Extract OS and Arch
            OS="unknown"
            ARCH="unknown"
            
            if [[ "$FILENAME" == *"-linux-x64"* ]]; then
              OS="linux"
              ARCH="x64"
            elif [[ "$FILENAME" == *"-linux-arm64"* ]]; then
              OS="linux"
              ARCH="arm64"
            elif [[ "$FILENAME" == *"-macos-x64"* ]]; then
              OS="macos"
              ARCH="x64"
            elif [[ "$FILENAME" == *"-macos-arm64"* ]]; then
              OS="macos"
              ARCH="arm64"
            elif [[ "$FILENAME" == *"-windows-x64"* ]]; then
              OS="windows"
              ARCH="x64"
            elif [[ "$COMPONENT" == *"web"* ]]; then
              OS="web"
              ARCH="wasm32"
            fi
            
            # If the platform was not identified, skip it to prevent bad uploads
            if [ "$OS" == "unknown" ]; then
              echo "Skipping unknown file format: $FILENAME"
              continue
            fi
            
            if [ -d "$item" ]; then
              echo "Uploading directory $FILENAME to s3://$STORAGE_ID/$COMPONENT/$TAG/$VERSION/$OS/$ARCH/$FILENAME/"
              
              aws s3 cp "$item/" \
                "s3://$STORAGE_ID/$COMPONENT/$TAG/$VERSION/$OS/$ARCH/$FILENAME/" \
                --recursive \
                --endpoint-url "$STORAGE_ENDPOINT" \
                --no-progress
            else
              echo "Uploading $FILENAME to s3://$STORAGE_ID/$COMPONENT/$TAG/$VERSION/$OS/$ARCH/"
              
              aws s3 cp "$item" \
                "s3://$STORAGE_ID/$COMPONENT/$TAG/$VERSION/$OS/$ARCH/$FILENAME" \
                --endpoint-url "$STORAGE_ENDPOINT" \
                --no-progress
            fi
          done

      - name: Update Global Manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ID: ${{ secrets.STORAGE_ID }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
        working-directory: scripts
        run: |
          bun cmd github update-manifest --tag ${{ steps.version.outputs.tag }} --version ${{ steps.version.outputs.version }} --component cli

      - name: Cleanup Old Releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ID: ${{ secrets.STORAGE_ID }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
        working-directory: scripts
        run: bun cmd github cleanup-s3 --tag ${{ steps.version.outputs.tag }}
